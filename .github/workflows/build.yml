# Validates the Lua/XML content, builds the PSoul/PokeNation server and the frozen legacy client
# from the source in this repository, runs runtime smoke tests and uploads development packages
# as workflow artifacts (never as a public Release):
#
#   PokeNation-Server-Windows        PokeNation-Server-Windows-Dev.zip        (+ .sha256)
#   PokeNation-LegacyClient-Windows  PokeNation-LegacyClient-Windows-Dev.zip  (+ .sha256)
#   PokeNation-Server-Linux          PokeNation-Server-Linux-Dev.tar.gz       (+ .sha256)
#   PokeNation-LegacyClient-Linux    PokeNation-LegacyClient-Linux-Dev.tar.gz (+ .sha256)
#
# Nothing from the original archive's precompiled binaries is used; every executable is compiled
# here by tools/build_*.sh and packaged by tools/package.sh. See docs/BUILDING.md.
name: Build development packages

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "original/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "original/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARTIFACT_RETENTION_DAYS: 14
  BUILD_TYPE: development

jobs:
  # --------------------------------------------------------------------------------------------
  validate:
    name: Validate Lua/XML and references
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.1 libxml2-utils
      - name: Lua/XML syntax check
        run: tools/check_syntax.sh
      - name: Broken reference check (fails only on new REAL ERRORs, see docs/BROKEN_REFERENCES.md)
        run: python3 tools/check_references.py --strict
      - name: Shell script syntax
        run: for f in tools/*.sh tools/package-files/linux/*/*.sh; do bash -n "$f" || exit 1; done

  # --------------------------------------------------------------------------------------------
  linux:
    name: Linux x64 build, smoke test, package
    needs: validate
    runs-on: ubuntu-24.04
    # The schemas use MariaDB syntax (ALTER TABLE ... ADD COLUMN IF NOT EXISTS) and MariaDB is the
    # documented database, so the smoke test uses MariaDB instead of the runner's MySQL 8.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: psoul
          MARIADB_USER: psoul
          MARIADB_PASSWORD: ci-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # Git LFS bandwidth is metered; cache the two big assets (map.otbm, data.spr) between runs.
      - name: Compute LFS asset id
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Pull LFS objects
        run: git lfs pull

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config mariadb-client \
            libboost-system-dev libboost-filesystem-dev libboost-thread-dev libboost-regex-dev libboost-chrono-dev \
            liblua5.1-0-dev libxml2-dev libgmp-dev libmysqlclient-dev libsqlite3-dev libssl-dev \
            libphysfs-dev libopenal-dev libglew-dev libvorbis-dev libogg-dev zlib1g-dev \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev xvfb mesa-utils

      - name: Build server
        run: tools/build_server_linux.sh
      - name: Build legacy client
        run: tools/build_legacy_client_linux.sh

      - name: Package
        run: tools/package.sh all

      - name: Initialise database from the seed (as the packaged setup would)
        run: |
          D=dist/linux/server
          for f in mysql.sql psoul_extra_mysql.sql psoul_dev_seed.sql; do
            mysql -h127.0.0.1 -uroot -proot psoul < "$D/database/$f"
          done
          sed -E -e 's/^(\s*sqlHost\s*=\s*)"[^"]*"/\1"127.0.0.1"/' -e 's/^(\s*sqlUser\s*=\s*)"[^"]*"/\1"psoul"/' \
                 -e 's/^(\s*sqlPass\s*=\s*)"[^"]*"/\1"ci-password"/' \
                 -e 's/^(\s*sqlDatabase\s*=\s*)"[^"]*"/\1"psoul"/' "$D/config.example.lua" > "$D/config.lua"

      - name: Smoke test packaged server (startup, logins, starter, summon, battle, catch, logout)
        run: |
          cd dist/linux/server
          (timeout 900 ./psoul-server > /tmp/server.log 2>&1 &)
          for i in $(seq 1 170); do grep -q "^>> Cristal server Online" /tmp/server.log && break; sleep 1; done
          grep -q "^>> Cristal server Online" /tmp/server.log || { tail -80 /tmp/server.log; exit 1; }
          cd "$GITHUB_WORKSPACE"
          python3 tools/protocol_probe.py login --account admin --password admin | tee /tmp/probe.log
          grep -q "GM Admin" /tmp/probe.log
          python3 tools/smoke_test.py
          pkill -TERM -x psoul-server || true
          sleep 5
          echo "---- warnings/errors printed during startup ----"
          grep -nE "Warning|Error|error" /tmp/server.log || true

      - name: Smoke test packaged legacy client (Xvfb, loads modules)
        run: |
          cd dist/linux/client
          rm -f ~/psoul.log
          ALSOFT_DRIVERS=null timeout 40 xvfb-run -a -s "-screen 0 1280x800x24" ./psoulclient > /tmp/client.log 2>&1 || true
          grep -q "Loaded module 'game_interface'" /tmp/client.log || { cat /tmp/client.log; exit 1; }
          ! grep -q "Application crashed" /tmp/client.log

      - name: Collect logs
        if: always()
        run: mkdir -p /tmp/ci-logs && cp /tmp/*.log /tmp/ci-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-linux
          path: /tmp/ci-logs
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - uses: actions/upload-artifact@v4
        with:
          name: PokeNation-Server-Linux
          path: |
            dist/PokeNation-Server-Linux-Dev.tar.gz
            dist/PokeNation-Server-Linux-Dev.tar.gz.sha256
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
      - uses: actions/upload-artifact@v4
        with:
          name: PokeNation-LegacyClient-Linux
          path: |
            dist/PokeNation-LegacyClient-Linux-Dev.tar.gz
            dist/PokeNation-LegacyClient-Linux-Dev.tar.gz.sha256
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # --------------------------------------------------------------------------------------------
  windows:
    name: Windows x64 build (MSYS2 MinGW-w64), smoke test, package
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compute LFS asset id
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Pull LFS objects
        shell: bash
        run: git lfs pull

      # Same package list as tools/windows/Build-PokeNation-Windows.ps1 -InstallDependencies.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-lua51
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-libmariadbclient
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-physfs
            mingw-w64-x86_64-openal
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg

      - name: Build and package with Build-PokeNation-Windows.ps1
        shell: powershell
        run: |
          git config --global --add safe.directory '*'
          & tools\windows\Build-PokeNation-Windows.ps1 -MsysRoot '${{ steps.msys2.outputs.msys2-location }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\windows\server\*.exe, dist\windows\client\*.exe, dist\*.zip, dist\*.sha256 | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PokeNation-Server-Windows
          path: |
            dist/PokeNation-Server-Windows-Dev.zip
            dist/PokeNation-Server-Windows-Dev.zip.sha256
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
      - uses: actions/upload-artifact@v4
        with:
          name: PokeNation-LegacyClient-Windows
          path: |
            dist/PokeNation-LegacyClient-Windows-Dev.zip
            dist/PokeNation-LegacyClient-Windows-Dev.zip.sha256
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      # ---- Windows runtime smoke test of the packaged files, using the packaged launchers ----
      - name: Install MariaDB
        shell: powershell
        run: |
          choco install mariadb -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Service -Name 'MariaDB*', 'MySQL*' -ErrorAction SilentlyContinue | Format-Table Name, Status

      - name: Setup-PokeNation-Database.ps1 (fresh database from the seed)
        shell: powershell
        working-directory: dist/windows/server
        run: |
          .\Setup-PokeNation-Database.ps1 -NonInteractive -RootPassword ''
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Start-PokeNation-Server.ps1 -CheckOnly
        shell: powershell
        working-directory: dist/windows/server
        run: |
          .\Start-PokeNation-Server.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test PokeNationServer.exe (startup, logins, starter, summon, battle, catch, logout)
        shell: powershell
        run: |
          $dir = (Resolve-Path dist\windows\server).Path
          $p = Start-Process -FilePath "$dir\PokeNationServer.exe" -WorkingDirectory $dir -PassThru -NoNewWindow `
                 -RedirectStandardOutput "$env:RUNNER_TEMP\server.log" -RedirectStandardError "$env:RUNNER_TEMP\server-stderr.log"
          $online = $false
          for ($i = 0; $i -lt 240; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { break }
            if (Select-String -Path "$env:RUNNER_TEMP\server.log" -Pattern '^>> Cristal server Online' -Quiet) { $online = $true; break }
          }
          if (-not $online) { Get-Content "$env:RUNNER_TEMP\server.log" -Tail 80; Get-Content "$env:RUNNER_TEMP\server-stderr.log"; exit 1 }
          Write-Host "server online after $i s"
          python tools\protocol_probe.py login --account admin --password admin | Tee-Object -FilePath "$env:RUNNER_TEMP\probe.log"
          if (-not (Select-String -Path "$env:RUNNER_TEMP\probe.log" -Pattern 'GM Admin' -Quiet)) { exit 1 }
          python tools\smoke_test.py | Tee-Object -FilePath "$env:RUNNER_TEMP\smoke.log"
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "---- warnings/errors printed during startup ----"
          Select-String -Path "$env:RUNNER_TEMP\server.log" -Pattern 'Warning|Error|error' | ForEach-Object { $_.Line }
          exit $code

      # Informational: hosted runners have no GPU, and the client needs OpenGL 2. A failure here is
      # reported in the job summary but does not fail the build (see docs/WINDOWS_LOCAL_TESTING.md).
      - name: Launch PokeNationLegacyClient.exe (informational)
        id: client
        continue-on-error: true
        shell: powershell
        run: |
          $dir = (Resolve-Path dist\windows\client).Path
          $log = Join-Path $env:USERPROFILE 'psoul.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "$dir\PokeNationLegacyClient.exe" -WorkingDirectory $dir -PassThru
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          Copy-Item $log "$env:RUNNER_TEMP\client-psoul.log" -ErrorAction SilentlyContinue
          if (Test-Path $log) { Get-Content $log -Tail 60 } else { Write-Host "no $log written" }
          Write-Host "client still running after 30 s: $alive"
          if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern "Loaded module 'game_interface'" -Quiet)) { exit 1 }

      - name: Job summary
        if: always()
        shell: powershell
        run: |
          $c = '${{ steps.client.outcome }}'
          "### Windows runtime`n- Server smoke test: see step log`n- Legacy client launch on the hosted runner: $c" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-windows
          path: ${{ runner.temp }}/*.log
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
